<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doctor Appointment Form</title>
  <style>
    :root{
      --card-bg: #fff;
      --page-bg: #f9f9f9;
      --muted: #777;
      --accent: #d33;
      --border: #ccc;
      --max-width: 900px;
    }

    body{
      font-family: Arial, sans-serif;
      background: var(--page-bg);
      margin: 30px;
      display:flex;
      justify-content:center;
      line-height:1.3;
    }

    .card{
      width:100%;
      max-width: var(--max-width);
      background: var(--card-bg);
      border: 1px solid var(--border);
      display:flex;
      gap:0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      overflow:hidden;
    }

    /* Left: image; Right: form */
    .card .media{
      width: 330px;
      min-width: 200px;
      object-fit: cover;
      display:block;
    }

    .form-wrap{
      flex:1;
      padding:24px;
      box-sizing:border-box;
    }

    h2{
      margin:0 0 6px 0;
      font-size:22px;
      color:#222;
    }

    .accent-line{
      height:3px;
      background:var(--accent);
      width:100%;
      margin: 12px 0 18px;
    }

    /* responsive form grid */
    .form-grid{
      display:grid;
      grid-template-columns: 130px 1fr;
      gap:10px 12px;
      align-items:start;
      width:100%;
    }

    label{
      font-size:13px;
      font-weight:bold;
      padding-top:6px;
      display:block;
    }

    .hint{
      display:block;
      font-size:11px;
      color:var(--muted);
      font-weight:normal;
      margin-top:4px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    input[type="tel"],
    textarea,
    select {
      padding:8px;
      border:1px solid var(--border);
      border-radius:4px;
      width:100%;
      box-sizing:border-box;
      font-size:14px;
    }

    textarea { resize:vertical; min-height:70px; }

    /* split inputs (first / last, city / state) */
    .split{
      display:flex;
      gap:8px;
    }
    .split > * { flex:1; }

    fieldset{
      border:0;
      padding:0;
      margin:0;
    }
    .controls { font-weight:normal; font-size:13px; color:#333; }

    .controls input[type="radio"],
    .controls input[type="checkbox"] { margin-right:6px; transform:scale(1); }

    .form-actions{
      grid-column: 2 / 3;
      padding-top:8px;
    }

    button[type="submit"]{
      padding:8px 18px;
      background:#f0f0f0;
      border:1px solid #adadad;
      border-radius:4px;
      cursor:pointer;
    }

    /* small screens: stack, image on top */
    @media (max-width:700px){
      .card{ flex-direction:column; }
      .card .media{ width:100%; height:200px; }
      .form-grid{ grid-template-columns: 1fr; }
      .form-actions { grid-column: 1 / 2; }
      label { padding-top:0; }
    }
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Doctor appointment card">
    <!-- Use a real image URL; the following is a sample Unsplash image -->
    <img class="media" src="https://images.unsplash.com/photo-1550831107-1553da8c8464?q=80&w=1200&auto=format&fit=crop&ixlib=rb-4.0.3&s=9c6d7be6b8f6f4c7a0a3b1f9a1a8b3d7" alt="Portrait of a doctor" />

    <div class="form-wrap">
      <h2>Doctor Appointment Form</h2>
      <div class="accent-line" aria-hidden="true"></div>

      <form novalidate aria-describedby="form-desc">
        <p id="form-desc" class="hint">Fill out the fields below to request an appointment.</p>

        <div class="form-grid">
          <label for="appt-date">Appointment Date</label>
          <div>
            <input id="appt-date" name="appointment_date" type="date" required />
          </div>

          <label for="appt-time">Appointment Time</label>
          <div>
            <input id="appt-time" name="appointment_time" type="time" required />
          </div>

          <label for="name-first">Name</label>
          <div>
            <div class="split" aria-labelledby="name-label">
              <div>
                <input id="name-first" name="first_name" type="text" placeholder="First" required />
              </div>
              <div>
                <input id="name-last" name="last_name" type="text" placeholder="Last" required />
              </div>
            </div>
            <span id="name-label" class="hint">First and last name</span>
          </div>

          <label>Gender</label>
          <div>
            <fieldset class="controls" aria-label="Gender">
              <label><input type="radio" name="gender" id="gender-m" value="male" required /> <span>Male</span></label>
              &nbsp;&nbsp;
              <label><input type="radio" name="gender" id="gender-f" value="female" /> <span>Female</span></label>
              &nbsp;&nbsp;
              <label><input type="radio" name="gender" id="gender-o" value="other" /> <span>Other</span></label>
            </fieldset>
          </div>

          <label for="phone">Phone</label>
          <div>
            <input id="phone" name="phone" type="tel" placeholder="e.g. +1-555-555-5555" pattern="[\d\+\-\s\(\)]{7,}" aria-describedby="phone-hint" />
            <span id="phone-hint" class="hint">Include country code if outside local area</span>
          </div>

          <label for="address">Address</label>
          <div>
            <div style="margin-bottom:8px;">
              <input id="address" name="address" type="text" placeholder="Street address or P.O. box" />
            </div>
            <div class="split">
              <input id="city" name="city" type="text" placeholder="City" />
              <input id="state" name="state" type="text" placeholder="State / Province" />
            </div>
          </div>

          <label for="query">Your Query</label>
          <div>
            <textarea id="query" name="query" rows="4" placeholder="Describe your reason for visit"></textarea>
          </div>

          <label>Appointment Type</label>
          <div>
            <fieldset class="controls" aria-label="Appointment type">
              <span class="hint" style="display:block; margin-bottom:6px; color:#000; font-weight:bold; font-size:12px;">Select which appointment type(s) you require</span>
              <label><input type="checkbox" name="appt_type" value="cervix" /> Cervix checkup</label><br />
              <label><input type="checkbox" name="appt_type" value="heart" checked /> Heart checkup</label><br />
              <label><input type="checkbox" name="appt_type" value="eye" /> Eye check-up</label><br />
              <label><input type="checkbox" name="appt_type" value="hearing" /> Hearing Test</label>
            </fieldset>
          </div>

          <div></div>
          <div class="form-actions">
            <button type="submit">Send</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
